[project]
name = "access-eval"
version = "0.1.0"
description = "Accessibility profiles: jointly measuring the breadth and reliability of LLM capabilities beyond single benchmark scores"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "math-verify>=0.8.0",
    "sympy>=1.12",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "huggingface_hub>=0.24",
    "datasets>=2.20",
    "transformers>=4.56",
]

[project.optional-dependencies]
# in-process local inference (answers, local judges, paraphrase generation)
vllm = ["vllm>=0.10.2", "torch>=2.4"]
# paper reproduction (figures, statistics); exact versions used for the paper are in paper/requirements.txt
paper = ["matplotlib>=3.8", "scipy>=1.11", "pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
access-eval = "access_eval.cli:main"

[project.urls]
Homepage = "https://github.com/kazemf78/access-eval"
Data = "https://github.com/kazemf78/access-eval-data"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Prompt templates, few-shot demos and the validated formulation sets are read at run time.
[tool.setuptools.package-data]
access_eval = ["prompts/**/*.txt", "prompts/**/*.json", "data/validated/**/*.csv", "data/validated/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
